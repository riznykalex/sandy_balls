<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Піщані кульки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: linear-gradient(to bottom, #0057b8, #ffd700);
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    button {
      margin: 10px;
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #555;
      color: white;
    }

    button:active { background-color: #888; }

    #startScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      z-index: 2;
      position: relative;
    }

    #gameScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
      z-index: 2;
      position: relative;
    }

    #canvasContainer {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 500px;
      z-index: 3; /* поверх шару зірок */
    }

    canvas {
      border: 1px solid rgba(255, 255, 255, 0.2);
      touch-action: none;
      background-color: transparent;
      z-index: 3;
      position: relative;
    }

    /* Шар фонових зірочок (під канвою та UI) */
    .star-layer {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* щоб не заважати клікам/тапам */
      overflow: visible;
      z-index: 1;
    }

    /* Окрема зірочка */
    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      will-change: transform, opacity;
      opacity: 0;
      transform: translate3d(0,0,0) scale(1);
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
    }

    /* невеличкий "блік" — псевдоелемент */
    .star::after{
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 120%;
      height: 120%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.2) 40%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    /* анімація прольоту: рух та зникання */
    @keyframes star-fly {
      0% { opacity: 0; transform: translate3d(var(--sx), var(--sy), 0) scale(var(--s)); }
      10% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--ex), var(--ey), 0) scale(calc(var(--s) * 0.8)); }
    }

  </style>
</head>
<body>

  <!-- шар зірочок -->
  <div class="star-layer" id="starLayer" aria-hidden="true"></div>

  <!-- Початковий екран -->
  <div id="startScreen">
    <h1>Піщані кульки</h1>
    <h3>(заповніть поле одним з кольорів від краю до краю)</h3>
    <p>Оберіть рівень складності:</p>
    <button onclick="startGame(4)">Легкий (4 кольори)</button>
    <button onclick="startGame(5)">Середній (5 кольорів)</button>
    <button onclick="startGame(6)">Складний (6 кольорів)</button>
  </div>

  <!-- Ігровий екран -->
  <div id="gameScreen">
    <div id="canvasContainer">
      <canvas id="gameCanvas"></canvas>
    </div>
  </div>

<script>
  /* =======================
     Ігрова частина (без змін, просто інтегровано)
     ======================= */
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const GAME_WIDTH = 400;
  const GAME_HEIGHT = 600;
  canvas.width = GAME_WIDTH;
  canvas.height = GAME_HEIGHT;

  function resizeCanvas() {
    const scale = Math.min(
      window.innerWidth / GAME_WIDTH,
      (window.innerHeight - 100) / GAME_HEIGHT
    );
    canvas.style.width = GAME_WIDTH * scale + "px";
    canvas.style.height = GAME_HEIGHT * scale + "px";
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  const gridSize = 8;
  const columns = GAME_WIDTH / gridSize;
  const rows = GAME_HEIGHT / gridSize;

  let keys = {};
  document.addEventListener("keydown", e => keys[e.key] = true);
  document.addEventListener("keyup", e => keys[e.key] = false);

  let control = { left: false, right: false, down: false };

  // Керування дотиком (тап-зони)
  canvas.addEventListener("touchstart", e => {
    const t = e.touches[0];
    const x = t.clientX;
    const y = t.clientY;

    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    control.left = control.right = control.down = false;

    if (y > screenHeight * 0.75) {
      control.down = true; // нижня зона
    } else if (x < screenWidth / 2) {
      control.left = true; // ліва половина
    } else {
      control.right = true; // права половина
    }
  });

  canvas.addEventListener("touchend", () => {
    control.left = control.right = control.down = false;
  });

  // Перехід між екранами
  function startGame(level) {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "flex";
    activeColors = colorSets[level];
    ball = new Ball(GAME_WIDTH / 2, 0, getRandomColor(), 50);
    score = 0;
    gameOver = false;
    particles = [];
    grid = Array.from({ length: rows }, () => Array(columns).fill(null));
    pendingParticles = [];
    gameLoop();
  }

  const colorSets = {
    4: ["red", "blue", "yellow", "green"],
    5: ["orange", "purple", "cyan", "lime", "pink"],
    6: ["teal", "magenta", "gold", "navy", "salmon", "turquoise"]
  };

  let score = 0;
  let gameOver = false;
  let particles = [];
  let grid = Array.from({ length: rows }, () => Array(columns).fill(null));
  let pendingParticles = [];
  let activeColors = [];
  let ball;

  function getRandomColor() {
    return activeColors[Math.floor(Math.random() * activeColors.length)];
  }

  class Ball {
    constructor(x, y, color, volume) {
      this.x = x;
      this.y = y;
      this.radius = 16;
      this.color = color;
      this.volume = volume;
      this.speed = 2;
      this.active = true;
    }

    update(grid) {
      if (!this.active || gameOver) return;
      if (keys["ArrowDown"] || control.down) this.y += this.speed * 3;
      else this.y += this.speed;
      if ((keys["ArrowLeft"] || control.left) && this.x - this.radius > 0) this.x -= 4;
      if ((keys["ArrowRight"] || control.right) && this.x + this.radius < GAME_WIDTH) this.x += 4;
      if (this.hasHit(grid)) {
        this.active = false;
        prepareParticles(this);
      }
    }

    draw(ctx) {
      if (!this.active || gameOver) return;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x - this.radius * 0.4, this.y - this.radius * 0.4, this.radius * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.fill();
      ctx.closePath();
    }

    hasHit(grid) {
      const bottomY = this.y + this.radius;
      if (bottomY >= GAME_HEIGHT) return true;
      const col = Math.floor(this.x / gridSize);
      const row = Math.floor(bottomY / gridSize);
      return grid[row]?.[col] !== null;
    }
  }

  class Particle {
    constructor(col, row, color) {
      this.col = col;
      this.row = row;
      this.color = color;
    }

    update(grid) {
      if (this.row < rows - 1) {
        if (grid[this.row + 1][this.col] === null) {
          grid[this.row][this.col] = null;
          this.row++;
          grid[this.row][this.col] = this.color;
          return;
        }
        if (this.col > 0 && grid[this.row + 1][this.col - 1] === null) {
          grid[this.row][this.col] = null;
          this.row++;
          this.col--;
          grid[this.row][this.col] = this.color;
          return;
        }
        if (this.col < columns - 1 && grid[this.row + 1][this.col + 1] === null) {
          grid[this.row][this.col] = null;
          this.row++;
          this.col++;
          grid[this.row][this.col] = this.color;
          return;
        }
      }
    }

    draw(ctx) {
      const cx = this.col * gridSize + gridSize / 2;
      const cy = this.row * gridSize + gridSize / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, gridSize / 2, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx - gridSize * 0.2, cy - gridSize * 0.2, gridSize * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.fill();
      ctx.closePath();
    }
  }

  function prepareParticles(ball) {
    const centerCol = Math.floor(ball.x / gridSize);
    for (let i = 0; i < ball.volume; i++) {
      let offset = Math.floor(Math.random() * 10) - 5;
      let col = Math.max(0, Math.min(columns - 1, centerCol + offset));
      pendingParticles.push({ col, color: ball.color });
    }
  }

  function releasePendingParticles() {
    if (pendingParticles.length > 0) {
      let batch = pendingParticles.splice(0, 2);
      for (let item of batch) {
        for (let row = rows - 1; row >= 0; row--) {
          if (grid[row][item.col] === null) {
            grid[row][item.col] = item.color;
            particles.push(new Particle(item.col, row, item.color));
            break;
          }
        }
      }
    } else if (!ball.active && !gameOver) {
      if (canSpawnBall()) ball = new Ball(GAME_WIDTH / 2, 0, getRandomColor(), 50);
      else triggerGameOver();
    }
  }

  function canSpawnBall() {
    return grid[0][Math.floor(GAME_WIDTH / 2 / gridSize)] === null;
  }

  function updateParticles() {
    for (let p of particles) p.update(grid);
  }

  function drawParticles() {
    for (let p of particles) p.draw(ctx);
  }

  function checkConnectedGroups() {
    if (pendingParticles.length > 0) return;
    let visited = Array.from({ length: rows }, () => Array(columns).fill(false));
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < columns; col++) {
        let color = grid[row][col];
        if (color === null || visited[row][col]) continue;
        let group = findConnectedGroup(row, col, color, visited);
        if (touchesBothEdges(group)) {
          for (let [r, c] of group) grid[r][c] = null;
          particles = particles.filter(p => !group.some(([r, c]) => p.row === r && p.col === c));
          score += group.length * 10;
        }
      }
    }
    applyGravity();
  }

  function applyGravity() {
    for (let col = 0; col < columns; col++) {
      let writeRow = rows - 1;
      for (let row = rows - 1; row >= 0; row--) {
        if (grid[row][col] !== null) {
          let color = grid[row][col];
          grid[row][col] = null;
          grid[writeRow][col] = color;
          let p = particles.find(pp => pp.col === col && pp.row === row && pp.color === color);
          if (p) p.row = writeRow;
          writeRow--;
        }
      }
    }
  }

  function findConnectedGroup(row, col, color, visited) {
    let stack = [[row, col]], group = [];
    while (stack.length > 0) {
      let [r, c] = stack.pop();
      if (r < 0 || r >= rows || c < 0 || c >= columns) continue;
      if (visited[r][c] || grid[r][c] !== color) continue;
      visited[r][c] = true;
      group.push([r, c]);
      stack.push([r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]);
    }
    return group;
  }

  function touchesBothEdges(group) {
    let left = false, right = false;
    for (let [r, c] of group) {
      if (c === 0) left = true;
      if (c === columns - 1) right = true;
    }
    return left && right;
  }

  function drawScore() {
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Рахунок: " + score, 10, 30);
  }

  // Закінчення гри
  let gameOverTimer = 0;
  let explosionParticles = [];

  function triggerGameOver() {
    gameOver = true;
    gameOverTimer = 0;

    explosionParticles = particles.map(p => ({
      x: p.col * gridSize + gridSize / 2,
      y: p.row * gridSize + gridSize / 2,
      color: p.color,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6
    }));
  }

  function drawGameOver() {
    if (!gameOver) return;

    gameOverTimer++;

    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Гра завершена", GAME_WIDTH / 2, GAME_HEIGHT / 2);

    if (gameOverTimer > 60) {
      for (let p of explosionParticles) {
        p.x += p.vx;
        p.y += p.vy;
        ctx.beginPath();
        ctx.arc(p.x, p.y, gridSize / 2, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
    }

    if (gameOverTimer > 120) {
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("startScreen").style.display = "flex";
      return;
    }

    requestAnimationFrame(drawGameOver);
  }

  function gameLoop() {
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ball.update(grid);
    ball.draw(ctx);
    releasePendingParticles();
    updateParticles();
    checkConnectedGroups();
    drawParticles();
    drawScore();

    if (!gameOver) {
      requestAnimationFrame(gameLoop);
    } else {
      drawGameOver();
    }
  }

/* падає "зірка" */

const starLayer = document.getElementById('starLayer');

function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function spawnStar() {
  const star = document.createElement('div');
  star.className = 'star';

  const size = randomBetween(2, 6); // розмір
  star.style.width = size + 'px';
  star.style.height = size + 'px';

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  const startX = randomBetween(vw/4, vw-vw/4);
  const startY = -20;

  const angle = randomBetween(20, 40) * (Math.random() < 0.5 ? -1 : 1);

  const dx = Math.tan(angle * Math.PI/180) * vh;

  const endX = startX + dx;
  const endY = vh + 40;

  star.style.setProperty('--sx', startX + 'px');
  star.style.setProperty('--sy', startY + 'px');
  star.style.setProperty('--ex', endX + 'px');
  star.style.setProperty('--ey', endY + 'px');

  star.style.setProperty('--s', (randomBetween(0.8, 1.4)).toFixed(2));
  star.style.background = 'rgba(255,255,255,1)';

  const duration = randomBetween(4000, 6500); // 4–6.5 сек
  star.style.animation = `star-fly ${duration}ms linear forwards`;

  starLayer.appendChild(star);
  star.addEventListener("animationend", () => star.remove());
}

function startStarLoop() {
  (function loop() {
    const count = Math.random() < 0.2 ? 2 : 1;
    for (let i = 0; i < count; i++) {
      setTimeout(spawnStar, Math.random() * 400);
    }

    const next = randomBetween(5000, 10000);
    setTimeout(loop, next);
  })();
}

window.addEventListener('load', () => {
  setTimeout(startStarLoop, 800);
});


</script>
</body>
</html>
